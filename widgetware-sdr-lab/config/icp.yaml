# Ideal Customer Profile (ICP) for WidgetWare.
# Every research and scoring agent reads this file to decide what "a good
# fit" means. Edit this to match the real target market before running any
# agent for real.
#
# WidgetWare sells an embeddable analytics/dashboard component library and
# hosted API that B2B SaaS companies drop into their own product, so their
# end users get self-serve reporting without the vendor building
# charting/analytics infrastructure in-house. See config/offering.yaml for
# the full offering and config/proof-points.yaml for sourced proof points.

industry:
  - B2B SaaS / vertical software
  - Fintech / payments platforms
  - E-commerce / marketplace platforms
  - Healthtech / health IT

company_size:
  minimum_employees: 50
  maximum_employees: 2000   # still worth pursuing above this, just not prioritized

geography:
  - United States
  - Canada
  - United Kingdom
  - Ireland
  - Australia
  - New Zealand

target_roles:
  - VP of Product
  - VP of Engineering
  - Chief Product Officer
  - Director of Product
  - Head of Platform Engineering
  - Product Manager, Analytics/Reporting
  - Staff/Principal Engineer
  - Engineering Manager, Platform

buying_signals:
  - job postings for data visualization engineer, analytics engineer, or embedded BI roles
  - public roadmap or changelog mentions of customer dashboards, reporting, or insights features shipping soon
  - recent Series B+ funding round
  - job postings or reviews mentioning an existing embedded-analytics vendor
  - headcount growth in product/engineering over the last two quarters
  - new VP of Product or CPO hire in the last six months
  - stated priority around self-serve reporting or customer insights
